<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Backyard Homes PA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="map"></div>

  <!-- Left: search and controls -->
  <aside class="panel left" id="left">
    <div class="brand">
      <div class="eyebrow">Pennsylvania ADU tool</div>
      <h1>Backyard Homes PA</h1>
      <p class="muted">Search an address or click the map to test a spot.</p>
    </div>

    <div class="search">
      <input id="q" type="search" placeholder="Search an address in PA" autocomplete="off">
      <ul id="suggest" hidden></ul>
      <div id="search-msg" class="msg" hidden></div>
    </div>

    <div class="row">
      <span class="label">Rules</span>
      <div class="seg" id="rule">
        <button data-v="current" class="on">Today</button>
        <button data-v="hb2186">HB 2186</button>
      </div>
    </div>

    <div class="row">
      <span class="label">Map color</span>
      <select id="metric">
        <option value="jobs_after">Job change since 2019</option>
        <option value="jobs_shift">Shift after 2019</option>
        <option value="lots_fit">Lots with room (6950)</option>
      </select>
    </div>

    <div class="legend" id="legend"></div>
    <div class="foot muted">MUSA 5500 + MUSA 6950 · <a href="../">Project docs</a></div>
  </aside>

  <!-- Right: report -->
  <section class="panel right" id="report" hidden>
    <header class="report-head">
      <div>
        <div class="eyebrow">Your site</div>
        <h2 id="r-title">-</h2>
        <div class="muted small" id="r-sub">-</div>
      </div>
      <button class="close" id="r-close" aria-label="Close">×</button>
    </header>
    <div class="report-body" id="r-body"></div>
  </section>

  <script type="module" src="./app.js"></script>
</body>
</html>
